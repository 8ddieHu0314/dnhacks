[project]
name = "rayban-vision-pipeline"
version = "0.1.0"
description = "Low-latency frame ingestion and segmentation scaffold for Meta AI glasses prototypes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["services"]
asyncio_mode = "auto"
testpaths = ["tests"]
