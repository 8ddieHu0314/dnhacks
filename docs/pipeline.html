<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glasses Inspector · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Glasses Inspector</p>
    <h1>Ask, look, answer: the reactive pipeline</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="glasses-pipeline-title glasses-pipeline-desc">
      <title id="glasses-pipeline-title">Glasses Inspector pipeline</title>
      <desc id="glasses-pipeline-desc">Architecture diagram showing spoken questions and camera frames flowing from Ray-Ban Meta glasses through the iPhone app to a Mac relay, which sends the frames of that moment, a detector close-up and the whole part catalog to Claude, and returns the spoken answer through the phone to the wearer.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones (painted first) -->
      <rect x="40" y="200" width="320" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="162" y="204" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="213" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ON THE WEARER</text>

      <rect x="384" y="72" width="352" height="376" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="528" y="76" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ON THE MAC</text>

      <rect x="760" y="200" width="160" height="248" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="808" y="204" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="840" y="213" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLOUD APIS</text>

      <!-- Arrows (behind nodes) -->
      <!-- a. glasses -> phone: video -->
      <line x1="168" y1="252" x2="232" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- k. phone -> glasses: voice (accent) -->
      <line x1="232" y1="276" x2="168" y2="276" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- b. phone -> relay: frames -->
      <line x1="344" y1="252" x2="408" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- j. relay -> phone: speech (return, dashed) -->
      <line x1="408" y1="276" x2="344" y2="276" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- e. catalog -> relay -->
      <line x1="480" y1="168" x2="480" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- c. relay -> detector: each frame (right, then up into detector bottom) -->
      <path d="M 552,244 H 624 Q 632,244 632,236 V 168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- d. detector -> relay: boxes (down, then left into relay right edge; dashed return) -->
      <path d="M 680,168 V 252 Q 680,260 672,260 H 552" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- f. relay -> claude: identify (API call) -->
      <line x1="552" y1="276" x2="776" y2="276" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- h. relay -> elevenlabs: sentences (down, right, down into top edge) -->
      <path d="M 536,296 V 324 Q 536,332 544,332 H 832 Q 840,332 840,340 V 360" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- l. relay -> dashboard -->
      <line x1="448" y1="296" x2="448" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (masked, 6-10px off the stroke) -->
      <rect x="174" y="234" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="243" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VIDEO·MIC</text>

      <rect x="182" y="282" width="36" height="12" rx="2" fill="#f5f5f5"/>

      <rect x="356" y="234" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="376" y="243" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FRAMES</text>

      <text x="376" y="291" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SPEECH</text>

      <rect x="634" y="282" width="52" height="12" rx="2" fill="#f5f5f5"/>

      <text x="254" y="249" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IOS</text>
      <text x="288" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">iPhone app</text>
      <text x="288" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DAT · on-device STT</text>

      <!-- Node: Part catalog (store) -->
      <rect x="408" y="104" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="408" y="104" width="144" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="416" y="112" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="432" y="121" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JSON</text>
      <text x="480" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Part catalog</text>
      <text x="480" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">components.json</text>

      <!-- Node: Mac relay (focal) -->
      <rect x="408" y="232" width="144" height="64" rx="6" fill="#f5f5f5"/>

      <rect x="416" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>

      <rect x="584" y="104" width="144" height="64" rx="6" fill="#f5f5f5"/>

      <rect x="592" y="112" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="608" y="121" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ONNX</text>
      <text x="656" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Local detector</text>

      <!-- Node: Claude (cloud API) -->
      <rect x="776" y="232" width="128" height="64" rx="6" fill="#f5f5f5"/>

      <rect x="776" y="360" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="776" y="360" width="128" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>

      <rect x="40" y="544" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
